[build]
  command = "npm run build"
  publish = ".site"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/evidence/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'; sandbox"
